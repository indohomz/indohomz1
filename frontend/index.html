<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Indohomz | Live Better. Not Louder.</title>
    <meta name="title" content="Indohomz | Luxury Co-Living in Gurgaon" />
    <meta name="description" content="Curated homes for people who value comfort, privacy, and simplicity. Premium co-living spaces in Gurgaon's finest neighborhoods." />
    <meta name="keywords" content="co-living, PG, Gurgaon, rental, luxury living, furnished rooms, premium accommodation" />
    <meta name="author" content="Indohomz" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://indohomz.com/" />
    <meta property="og:title" content="Indohomz | Luxury Co-Living in Gurgaon" />
    <meta property="og:description" content="Curated homes for people who value comfort, privacy, and simplicity. Premium co-living spaces in Gurgaon." />
    <meta property="og:image" content="https://indohomz.com/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://indohomz.com/" />
    <meta property="twitter:title" content="Indohomz | Luxury Co-Living in Gurgaon" />
    <meta property="twitter:description" content="Curated homes for people who value comfort, privacy, and simplicity. Premium co-living spaces in Gurgaon." />
    <meta property="twitter:image" content="https://indohomz.com/og-image.jpg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#1A1918" />
    <meta name="msapplication-TileColor" content="#1A1918" />
    
    <!-- Preconnect to font servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Luxury Fonts - Cormorant Garamond for headings, Sora for body -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Preload critical images -->
    <link rel="preload" href="/logo.png" as="image" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Indohomz",
      "description": "Premium co-living spaces in Gurgaon",
      "url": "https://indohomz.com",
      "telephone": "+919053070100",
      "email": "hello@indohomz.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Gurgaon",
        "addressRegion": "Haryana",
        "addressCountry": "IN"
      },
      "areaServed": {
        "@type": "City",
        "name": "Gurgaon"
      },
      "priceRange": "₹8,000 - ₹25,000/month"
    }
    </script>
    
    <!-- Initial loading state styles -->
    <style>
      /* Prevent flash of unstyled content */
      html {
        background-color: #FAF8F5;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: #FAF8F5;
        opacity: 0;
        animation: fadeIn 0.5s ease-out 0.1s forwards;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      /* Initial loader */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #FAF8F5;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      #initial-loader .loader-content {
        text-align: center;
      }
      
      #initial-loader .loader-bar {
        width: 120px;
        height: 2px;
        background: #E7E2DA;
        border-radius: 1px;
        overflow: hidden;
        margin-top: 24px;
      }
      
      #initial-loader .loader-progress {
        width: 100%;
        height: 100%;
        background: #D4A574;
        animation: loading 1.2s ease-in-out infinite;
        transform-origin: left;
      }
      
      @keyframes loading {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <!-- Initial loader - hidden when React mounts -->
    <div id="initial-loader">
      <div class="loader-content">
        <img src="/logo.png" alt="Indohomz" height="48" style="height: 48px; width: auto;" />
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
    
    <!-- React root -->
    <div id="root"></div>
    
    <!-- Hide loader when React is ready -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() {
              loader.remove();
            }, 400);
          }
        }, 300);
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
